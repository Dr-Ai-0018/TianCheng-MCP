[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiancheng-local-mcp"
version = "0.18.0"
description = "A workspace-jailed local MCP server for TianCheng on Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.1.0",
  "httpx2>=2.12,<3",
  "socksio==1.*",
  "pillow>=12.3,<13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
tiancheng-mcp = "tiancheng_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiancheng_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"config/command-policy.defaults.json" = "tiancheng_mcp/data/command-policy.defaults.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

# Source archives must remain portable even outside a Git checkout.
[tool.hatch.build.targets.sdist]
exclude = [
  "/.tmp*/**", "/.venv*/**", "/docs/**", "/state/**", "/audit/**",
  "/logs/**", "/reference/**", "/.uv-cache/**", "/.pytest_cache/**",
  "/.env", "/.agents/**", "/.codex/**", "/.aws/**",
  "/config/*.local.json", "/config/agent-profiles.json",
  "/config/access-policy.json", "/config/agent-sources.json", "/config/*.bak",
  "/exec-env.allowlist", "/dist/**", "/build/**",
]
# Keep the documented credential template; no real .env enters the archive.
include = [
  "/src/**", "/scripts/**", "/tests/**", "/manual/**", "/config/*.example.json", "/config/*.defaults.json",
  "/*.ps1", "/*.sh", "/*.md", "/pyproject.toml", "/uv.lock",
  "/.env.example", "/exec-env.allowlist.example", "/.gitignore", "/.github/**",
]
