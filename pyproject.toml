[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiancheng-local-mcp"
version = "0.16.0"
description = "A workspace-jailed local MCP server for TianCheng on Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.1.0",
  "httpx2>=2.12,<3",
  "socksio==1.*",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
tiancheng-mcp = "tiancheng_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiancheng_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"config/command-policy.defaults.json" = "tiancheng_mcp/data/command-policy.defaults.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
